name: Case proposal / 사례 제안
description: A public post-incident report the library should write up / 라이브러리에 넣을 공개 장애 보고서
title: "Case: <organization> — <one line>"
labels: [case-proposal]
body:
  - type: input
    id: url
    attributes:
      label: Report address / 보고서 주소
      description: The public page of the post-incident report / 공개된 보고서 페이지 주소
      placeholder: https://
    validations:
      required: true
  - type: input
    id: org
    attributes:
      label: Organization / 조직
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Incident date / 발생일
      placeholder: YYYY-MM-DD, or the year if that is all the report says
  - type: textarea
    id: summary
    attributes:
      label: One or two lines on what happened / 무슨 일이었는지 한두 줄
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the library / 왜 넣을 만한가 (optional / 선택)
